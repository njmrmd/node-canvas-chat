name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: CI only ever needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The vault, the password verifier and the CSRF check are the code this
      # product is most trusted on. They need no database, so they gate every
      # push.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Deliberately a separate, non-blocking job. `verify` is fast and
  # deterministic and stays the required gate; this one downloads a ~180 MB
  # browser and boots the app, and we do not yet know how stable it is.
  # Promote it into `verify` (and drop `continue-on-error`) once there is a
  # real spec with a track record — see TES-21.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed on the exact Playwright version, because that version is what
      # decides the browser revision. A bump misses the cache and redownloads,
      # which is the correct behaviour.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the pinned browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
